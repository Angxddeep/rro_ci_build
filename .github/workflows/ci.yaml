name: Build CertifiedPropsOverlay for PixelOS

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to OTA repo?'
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '0 * * * *'

env:
  GH_USERNAME: Angxddeep
  OTA_REPO: Angxddeep/PIXELOS-OTA
  PIXELOS_VERSION: seventeen
  TARGET_DEVICES: "xaga spes"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.compare.outputs.should_push }}
      latest_fp: ${{ steps.latest.outputs.latest_fp }}
      current_fp: ${{ steps.latest.outputs.current_fp }}

    steps:
      - name: Fetch latest upstream and current deployed props
        id: latest
        run: |
          set -euo pipefail

          UPSTREAM_URL="https://raw.githubusercontent.com/PixelOS-AOSP/official_devices/${PIXELOS_VERSION}/API/updater/CertifiedProps/certified_build_props.json"
          CURRENT_URL="https://raw.githubusercontent.com/${OTA_REPO}/xaga/certified_build_props.json"

          latest_json=$(curl -fsSL "$UPSTREAM_URL")
          latest_fp=$(echo "$latest_json" | jq -r '.FINGERPRINT // empty')

          current_json=$(curl -fsSL "$CURRENT_URL" 2>/dev/null || echo "{}")
          current_fp=$(echo "$current_json" | jq -r '.FINGERPRINT // empty')

          echo "Latest upstream fingerprint: $latest_fp"
          echo "Current deployed fingerprint: $current_fp"

          echo "latest_fp=${latest_fp}" >> "$GITHUB_OUTPUT"
          echo "current_fp=${current_fp}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          LATEST_FP: ${{ steps.latest.outputs.latest_fp }}
          CURRENT_FP: ${{ steps.latest.outputs.current_fp }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_INPUT: ${{ github.event.inputs.push }}
        run: |
          set -euo pipefail

          if [ -z "$LATEST_FP" ]; then
            echo "Error: Failed to fetch upstream fingerprint"
            exit 1
          fi

          if [ "$CURRENT_FP" != "$LATEST_FP" ]; then
            echo "Detected upstream CertifiedProps changes"
            if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$PUSH_INPUT" == 'false' ]]; then
              echo "Push disabled by user input"
              echo "should_push=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_push=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Current deployed fingerprint already matches upstream"
            if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
              echo "Manual trigger running build"
              if [[ "$PUSH_INPUT" == 'false' ]]; then
                echo "should_push=false" >> "$GITHUB_OUTPUT"
              else
                echo "should_push=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "should_push=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: check-version
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-version.outputs.should_push == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "platforms;android-36"

      - name: Fetch upstream CertifiedProps JSON
        run: |
          curl -fsSL "https://raw.githubusercontent.com/PixelOS-AOSP/official_devices/${PIXELOS_VERSION}/API/updater/CertifiedProps/certified_build_props.json" \
            -o certified_build_props.json

      - name: Generate Overlay XML
        run: |
          python3 scripts/generate_overlay.py certified_build_props.json overlay

      - name: Compile & Link Overlay APK
        run: |
          mkdir -p overlay/compiled out

          $ANDROID_HOME/build-tools/35.0.0/aapt2 compile \
            --dir overlay/res \
            -o overlay/compiled

          $ANDROID_HOME/build-tools/35.0.0/aapt2 link \
            -o out/certified_build_props-unsigned.apk \
            --min-sdk-version 34 \
            --target-sdk-version 36 \
            --manifest overlay/AndroidManifest.xml \
            -I $ANDROID_HOME/platforms/android-36/android.jar \
            --auto-add-overlay \
            overlay/compiled/*.flat

      - name: Zipalign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 \
            out/certified_build_props-unsigned.apk \
            out/certified_build_props-aligned.apk

      - name: Setup Release Key & Sign APK
        env:
          RELEASE_KEY_PRIV: ${{ secrets.RELEASE_KEY_PRIV }}
          RELEASE_KEY_PUB: ${{ secrets.RELEASE_KEY_PUB }}
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_KEY_PRIV:-}" ] && [ -n "${RELEASE_KEY_PUB:-}" ]; then
            echo "Signing with custom platform release key..."
            python3 -c "import base64, os; s = ''.join(os.environ['RELEASE_KEY_PRIV'].split()); s += '=' * ((4 - len(s) % 4) % 4); open('releasekey.pk8', 'wb').write(base64.b64decode(s))"
            printf '%s\n' "$RELEASE_KEY_PUB" | tr -d '\r' > releasekey.x509.pem

            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --key releasekey.pk8 \
              --cert releasekey.x509.pem \
              --out out/certified_build_props.apk \
              out/certified_build_props-aligned.apk

            $ANDROID_HOME/build-tools/35.0.0/apksigner verify -v \
              out/certified_build_props.apk
          else
            echo "::warning::RELEASE_KEY_PRIV / RELEASE_KEY_PUB secrets not set. Copying unsigned aligned APK as output artifact."
            cp out/certified_build_props-aligned.apk out/certified_build_props.apk
          fi

          cp certified_build_props.json out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CertifiedPropsOverlay
          path: out/

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CertifiedPropsOverlay ${{ steps.tag.outputs.tag }}
          files: |
            out/certified_build_props.apk
            out/certified_build_props.json
        env:
          GITHUB_TOKEN: ${{ secrets.CERTS_TOKEN || secrets.GITHUB_TOKEN }}

  push:
    needs: [check-version, build]
    if: ${{ needs.check-version.outputs.should_push == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: CertifiedPropsOverlay
          path: artifacts

      - name: Push to OTA repo
        env:
          LATEST_FP: ${{ needs.check-version.outputs.latest_fp }}
          CERTS_TOKEN: ${{ secrets.CERTS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CERTS_TOKEN:-}" ]; then
            echo "CERTS_TOKEN secret not configured. Skipping repository push."
            exit 0
          fi

          git config --global user.name "Angaddeep Singh"
          git config --global user.email "angxddeep@gmail.com"

          git clone "https://${GH_USERNAME}:${CERTS_TOKEN}@github.com/${OTA_REPO}.git" ota_repo
          cd ota_repo

          for device in $TARGET_DEVICES; do
            if git checkout "$device" 2>/dev/null; then
              echo "Updating branch: $device"
              find ../artifacts -type f -name "certified_build_props.apk" -exec cp {} ./ \;
              find ../artifacts -type f -name "certified_build_props.json" -exec cp {} ./ \;

              git add certified_build_props.apk certified_build_props.json
              if git diff --staged --quiet; then
                echo "No changes to commit on branch $device"
              else
                git commit -m "$device: Update certified props [$LATEST_FP]"
                git push origin "$device"
              fi
            else
              echo "Branch $device not found in $OTA_REPO, skipping."
            fi
          done
